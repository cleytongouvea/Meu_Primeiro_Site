<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fotos - Jornada De Evolução</title>

  <!-- Importando a fonte Cinzel Decorative do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333333;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-family: 'Cinzel Decorative', Georgia, serif;
      font-size: clamp(2.2rem, 4.5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #003d82;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.14);
      margin-bottom: 12px;
    }

    .menu-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 28px;
    }

    .menu-nav a {
      display: inline-block;
      background-color: #0056b3;
      color: #ffffff;
      padding: 10px 18px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .menu-nav a.ativo {
      background-color: #003d82;
    }

    .secao-fotos {
      max-width: 920px;
      margin: 20px auto;
    }

    .galeria-fotos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .cartao-foto {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 12px;
      width: 260px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.12);
    }

    .cartao-foto img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      border-radius: 10px;
    }

    .legenda-foto {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #333333;
    }
  </style>
</head>
<body>
  <h1>Jornada De Evolução</h1>

  <nav class="menu-nav" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <a href="sobre.html">Ler sobre mim &#10145;</a>
    <a href="fotos.html" class="ativo">Fotos</a>
  </nav>

  <section class="secao-fotos">
    <h2>Galeria de Fotos</h2>
    <p>Registros da jornada, estudos, projetos e marcos dessa evolução.</p>

    <div class="galeria-fotos">
      <div class="cartao-foto">
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="Notebook com código na tela">
        <p class="legenda-foto">Estudando código e estrutura web</p>
      </div>

      <div class="cartao-foto">
        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80" alt="Gráficos e análise de dados em tela">
        <p class="legenda-foto">Explorando dados e visualização</p>
      </div>

      <div class="cartao-foto">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" alt="Mesa de trabalho com computador">
        <p class="legenda-foto">Construindo novos projetos</p>
      </div>
    </div>
  </section>
</body>
</html>
